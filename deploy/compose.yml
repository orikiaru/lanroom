services:
  redis:
    image: redis:7
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lanroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lanroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanroom"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  lanroom-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      AUTH_SECRET: ${AUTH_SECRET}
    ports:
      - "17000:17000/udp"
      - "17001:17001/tcp"
    restart: unless-stopped

  manage:
    build:
      context: ..
      dockerfile: manage/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://lanroom:${POSTGRES_PASSWORD}@postgres:5432/lanroom
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_IP: ${SERVER_IP:-}
      SERVER_NAME: ${SERVER_NAME:-Lanroom 主节点}
      GEOIP_DB: /geoip/GeoLite2-City.mmdb
    volumes:
      - ./geoip:/geoip:ro
    ports:
      # 只绑定本机，对外统一走 nginx 的 443（见 deploy/ssl/）
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
