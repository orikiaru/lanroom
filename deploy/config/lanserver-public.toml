[Service]
name = "lanserver"
id = 1

[ThreadPool]
threadcount = 1

# 日志发给本机 logd，落到用户目录的 logs 下。
[LogClient]
ip = "127.0.0.1"
port = "19995"
type = "tcp"

[Timer]
offset_ms = 5
timer_lv_count = 4
timer_lvs = [128, 128, 128, 1]

[RedisClient]
ip = "127.0.0.1"
port = "6379"
type = "tcp"
timeout_ms = 25000
max_pending = 128

[RoomServer]
ip = "0.0.0.0"
port = "17001"
type = "tcp"

[RoomUdp]
ip = "0.0.0.0"
port = "17000"
type = "udp"
idle_timeout_ms = 60000

[LanServer]
member_ttl = 30
