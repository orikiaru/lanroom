# lanclient config
[Service]
name = "lanclient"
id = 1


[RoomClient]
ip = "127.0.0.1"
port = "17001"
type = "tcp"

# ip 由 --bind 覆盖，端口交给系统选。
[RoomUdp]
ip = "0.0.0.0"
port = "0"
type = "udp"
idle_timeout_ms = 60000


[LogClient]
ip		= "127.0.0.1"
port	= "19995"
type   	= "tcp"

[Timer]
offset_ms = 5		#定时器间隔,必须被1000整除
timer_lv_count = 4	#定时器分割等级数,必须>=2
#每一个偏移等级对应的tick数基数
#lv[0] = timer_lvs[0]
#lv[1] = timer_lvs[0]*timer_lvs[1]
#lv[2] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]
#lv[3] = timer_lvs[0]*timer_lvs[1]*timer_lvs[2]*timer_lvs[3]
timer_lvs = [128,128,128,1] #每级定时器对应的间隔,最后一级只能是1

[ThreadPool]
threadcount = 3 #协程工人线程数
