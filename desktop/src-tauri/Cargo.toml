[package]
name = "desktop"
version = "0.1.0"
description = "Lanroom file transfer"
authors = ["you"]
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = "=3.0.0-alpha.6"
tauri-plugin-dialog = "=3.0.0-alpha.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
