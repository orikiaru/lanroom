name: Build

on:
  workflow_dispatch:
    inputs:
      system:
        description: 系统
        type: choice
        options:
          - windows
          - linux
          - macos
        required: true
      kind:
        description: 版本
        type: choice
        options:
          - cli
          - gui
        required: true

jobs:
  cli:
    name: CLI ${{ inputs.system }}
    if: inputs.kind == 'cli'
    runs-on: ${{ inputs.system == 'windows' && 'windows-2022' || inputs.system == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules
        shell: bash
        run: |
          set -euo pipefail
          if git submodule update --init --recursive; then
            exit 0
          fi
          git config submodule.openidea.url "https://github.com/${GITHUB_REPOSITORY_OWNER}/openidea.git"
          git submodule update --init --recursive

      - name: Linux packages
        if: inputs.system == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3 pkg-config

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build --config Release --target lanclient --target lanserver --parallel
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build --target lanclient --target lanserver --parallel
          fi

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/cli
          find build -maxdepth 3 -type f \( -name 'lanroom-client' -o -name 'lanroom-client.exe' -o -name 'lanroom-server' -o -name 'lanroom-server.exe' -o -name 'wintun.dll' -o -name 'WebView2Loader.dll' \) -exec cp {} dist/cli/ \;
          cp config/client.toml config/server.toml dist/cli/
          test -e dist/cli/lanroom-client -o -e dist/cli/lanroom-client.exe
          test -e dist/cli/lanroom-server -o -e dist/cli/lanroom-server.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lanroom-cli-${{ inputs.system }}
          path: dist/cli/
          if-no-files-found: error

  gui:
    name: GUI ${{ inputs.system }}
    if: inputs.kind == 'gui'
    runs-on: ${{ inputs.system == 'windows' && 'windows-2022' || inputs.system == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules
        shell: bash
        run: |
          set -euo pipefail
          if git submodule update --init --recursive; then
            exit 0
          fi
          git config submodule.openidea.url "https://github.com/${GITHUB_REPOSITORY_OWNER}/openidea.git"
          git submodule update --init --recursive

      - name: Linux packages
        if: inputs.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 pkg-config curl wget file libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the room client
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build --config Release --target lanclient --parallel
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build --target lanclient --parallel
          fi

      - name: Build the window
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --no-bundle

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gui
          if [ -f desktop/src-tauri/target/release/desktop.exe ]; then
            cp desktop/src-tauri/target/release/desktop.exe dist/gui/lanroom-gui.exe
          else
            cp desktop/src-tauri/target/release/desktop dist/gui/lanroom-gui
          fi
          find build -maxdepth 3 -type f \( -name 'lanroom-client' -o -name 'lanroom-client.exe' -o -name 'wintun.dll' -o -name 'WebView2Loader.dll' \) -exec cp {} dist/gui/ \;
          cp config/client.toml dist/gui/
          test -e dist/gui/lanroom-gui -o -e dist/gui/lanroom-gui.exe
          test -e dist/gui/lanroom-client -o -e dist/gui/lanroom-client.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lanroom-gui-${{ inputs.system }}
          path: dist/gui/
          if-no-files-found: error
